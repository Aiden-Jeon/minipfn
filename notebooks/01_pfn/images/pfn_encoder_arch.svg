<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arwBlue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arwRed" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arwGray" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- ===== token sequence row ===== -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="48"  y="20" width="76" height="32" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="86"  y="41" fill="#1e40af">(x1, y1)</text>
    <rect x="140" y="20" width="76" height="32" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="178" y="41" fill="#1e40af">(x2, y2)</text>
    <rect x="232" y="20" width="76" height="32" rx="7" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="270" y="41" fill="#1e40af">(x3, y3)</text>
    <text x="326" y="42" fill="#94a3b8" font-size="18">···</text>
    <rect x="352" y="20" width="92" height="32" rx="7" fill="#fee2e2" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="398" y="41" fill="#b91c1c">[x*, ?]</text>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="178" y="70" fill="#64748b">context 토큰 (학습셋 D)</text>
    <text x="398" y="70" fill="#b91c1c">query (y 가려짐)</text>
  </g>
  <g text-anchor="middle">
    <rect x="560" y="20" width="150" height="32" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
    <text x="635" y="41" fill="#475569" font-size="13" font-weight="600">← 토큰 시퀀스</text>
  </g>

  <!-- ===== arrows into encoder ===== -->
  <g stroke-width="2" fill="none">
    <line x1="86"  y1="88" x2="86"  y2="148" stroke="#3b82f6" marker-end="url(#arwBlue)"/>
    <line x1="178" y1="88" x2="178" y2="148" stroke="#3b82f6" marker-end="url(#arwBlue)"/>
    <line x1="270" y1="88" x2="270" y2="148" stroke="#3b82f6" marker-end="url(#arwBlue)"/>
    <line x1="398" y1="88" x2="398" y2="148" stroke="#ef4444" marker-end="url(#arwRed)"/>
  </g>

  <!-- ===== transformer encoder box ===== -->
  <rect x="48" y="152" width="662" height="108" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="300" y="139" width="160" height="27" rx="13" fill="#334155"/>
  <text x="380" y="157" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Transformer encoder</text>

  <g font-size="14">
    <circle cx="82" cy="192" r="4" fill="#3b82f6"/>
    <text x="96" y="197" fill="#1e40af" font-weight="600">학습 토큰끼리 full attention</text>
    <circle cx="82" cy="226" r="4" fill="#ef4444"/>
    <text x="96" y="231" fill="#b91c1c" font-weight="600">쿼리 토큰 → 학습 토큰만 attention</text>
  </g>

  <rect x="470" y="178" width="222" height="62" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <g text-anchor="middle" fill="#4338ca">
    <text x="581" y="202" font-size="12.5" font-weight="600">causal mask 없음</text>
    <text x="581" y="223" font-size="12.5">→ 순서 불변 (permutation invariant)</text>
  </g>

  <!-- ===== output ===== -->
  <line x1="380" y1="260" x2="380" y2="298" stroke="#64748b" stroke-width="2" marker-end="url(#arwGray)"/>
  <rect x="266" y="302" width="228" height="40" rx="10" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="380" y="327" text-anchor="middle" fill="#166534" font-size="14" font-weight="600">예측분포  q(y | x*, D)</text>
</svg>
