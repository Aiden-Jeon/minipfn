# TabPFN v2·2.5 TabArena-Lite·BeyondArena 평가 (scripts/tabpfn_v2/eval.py --suite tabarena-lite 등).
# 공식 split을 돌리고 공개 leaderboard(Hugging Face Space TabArena/leaderboard)와 같은 방식으로
# Elo·정규화 점수·improvability·승률을 낸다. suite는 TABPFN_V2_SUITE, 체크포인트는
# TABPFN_V2_CHECKPOINTS(기본: Hub의 v2 공개 분류·회귀 가중치)로 준다. 통째로 바꾸므로 분류나 회귀
# 하나만 주면 다른 쪽 split은 imputed가 된다(공개 가중치가 섞이지 않는다):
#   databricks air run -f scripts/tabpfn_v2/eval_arena.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override "env_variables.TABPFN_V2_SUITE=beyondarena" \
#     --override "env_variables.TABPFN_V2_CHECKPOINTS=--classifier-path runs:/<run_id>/checkpoints/step_0500000.pt" \
#     --override "env_variables.TABPFN_V2_EXTRA_ARGS=--method-name minipfn-tabpfn-v2.5"
# 추론에 연산을 더 쓰는 방법(issue #43)은 TABPFN_V2_EXTRA_ARGS에 `--test-time greedy`(diagscale,
# diagscale+greedy)와 다른 --method-name을 준다. 기본보다 오래 걸리므로 timeout_minutes도 늘린다.
# greedy는 기본으로 최소 개선 조건과 split의 group·시간 열로 나눈 out-of-fold를 쓴다(issue #52).
# PR #49(논문 방식)와 같게 하려면 `--min-improvement 0 --oof-split random`을 더한다. BeyondArena를 여러
# 개 낼 때는 Hugging Face rate limit(429)에 걸리지 않게 5분 넘게 간격을 둔다.
# TFM → GBDT 증류(issue #44)는 TABPFN_V2_EXTRA_ARGS에 `--distill synthetic --student xgboost`(oof,
# labels; lightgbm)와 다른 --method-name을 준다. 학생은 CPU에서 예측한다.
# 2.5 checkpoint를 평가할 때는 experiment_name도 tabpfn-v2-5-reproduction으로 바꾼다(멤버 전처리와
# 크기 상한은 모델 구조로 정해진다).
experiment_name: tabpfn-v2-reproduction
mlflow_run_name: tabpfn-v2-eval-arena
environment:
  version: databricks_ai_v6
  # tabarena는 autogluon 사전 배포판과 ray를 쓰고 pandas<2.4를 요구한다(환경의 pandas 3은 2.3으로
  # 내려간다). data-foundry extra는 BeyondArena 데이터를 받는다. 환경 설치(uv)는 pre-release를
  # 버전을 적은 패키지에만 허용하므로 uv.lock과 같은 버전을 하나하나 적는다
  dependencies:
    - huggingface-hub>=0.34
    - tabarena[data-foundry]==0.1.1.dev20261031114042
    - bencheval==0.1.1.dev20261031114042
    - autogluon.tabular==1.6.4b20261101
    - autogluon.core[ray]==1.6.4b20261101
    - autogluon.common==1.6.4b20261101
    - autogluon.features==1.6.4b20261101
    # 증류 학생 (extra distill, uv.lock과 같은 버전)
    - xgboost==3.4.1
    - lightgbm==4.7.0
compute:
  accelerator_type: GPU_1xH100
  num_accelerators: 1
code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - scripts/tabpfn_v2/eval.py
env_variables:
  TABPFN_V2_SUITE: tabarena-lite
  TABPFN_V2_CHECKPOINTS: >-
    --classifier-path hf://aiden-jeon/minipfn-tabpfn-v2-classifier
    --regressor-path hf://aiden-jeon/minipfn-tabpfn-v2-regressor
  TABPFN_V2_EXTRA_ARGS: ""
  # 데이터셋을 나눠 GPU마다 worker 하나로 동시에 돌린다 (eval.py --shards). 8로 줄 때는
  # compute를 GPU_8xH100·8장으로 바꾼다
  TABPFN_V2_SHARDS: "1"
max_retries: 0
# BeyondArena core2k(split 2,000개)는 v2 크기 상한 안의 1,685개를 돌린다
timeout_minutes: 480
command: >-
  PYTHONPATH=$CODE_SOURCE_PATH/src
  python $CODE_SOURCE_PATH/scripts/tabpfn_v2/eval.py --suite $TABPFN_V2_SUITE
  $TABPFN_V2_CHECKPOINTS --shards $TABPFN_V2_SHARDS $TABPFN_V2_EXTRA_ARGS
