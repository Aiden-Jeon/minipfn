# attention 온도 비교 학습 (issue #102): curriculum stage 1을 처음부터 8×H100, batch 64로 돌리고 50k
# step에서 멈춘다(`TABPFN_V2_STOP_STEP`). lr 스케줄은 stage 1 그대로다(warmup 2,500, 250k cosine). 처음
# stage 1 run은 75k부터 ICL 0층 logit이 터졌고, PR #74의 soft-cap 실험은 50k에서 갈랐다. 모델·optimizer·
# 표 크기는 stage 1 그대로다(v3.5 multitask, 모든 파라미터 Muon, 1,024행). 학습 가속 옵션은 #92 prior
# 실험과 같다(compile·TF32·분산 Muon·worker 16). 붕괴 되돌리기는 끈다(무너지는지를 그대로 본다).
# checkpoint는 5k마다 남겨 scripts/tabpfn_v3/attention_probe.yaml로 층별 logit·온도 배율을 잰다.
# arm은 환경변수로 고른다(기본은 A):
#   databricks air run -f scripts/tabpfn_v3/attention_temperature.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override mlflow_run_name=tabpfn-v3-5-temp102-B-50k \
#     --override env_variables.TABPFN_V2_ATTENTION_TEMPERATURE=kumo --override env_variables.TABPFN_V2_LOGIT_SOFTCAP=none \
#     --override env_variables.TABPFN_V2_LR=8e-4
#   A (지금 구조, soft-cap 50, lr 4e-4): 그대로
#   A0 (대조, 지금 구조, soft-cap 없음, lr 8e-4): TABPFN_V2_LOGIT_SOFTCAP=none TABPFN_V2_LR=8e-4
#   B (Kumo식 온도, soft-cap 없음, lr 8e-4): 위 예
#   C (Kumo식 온도, soft-cap 없음, lr 4e-4): TABPFN_V2_ATTENTION_TEMPERATURE=kumo TABPFN_V2_LOGIT_SOFTCAP=none
experiment_name: tabpfn-v3-reproduction
mlflow_run_name: tabpfn-v3-5-temp102-A-50k
environment:
  version: databricks_ai_v6
  # TabICL prior (uv.lock과 같은 범위)
  dependencies:
    - tabicl>=2.2
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8
code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - scripts/tabpfn_v2/train.py
env_variables:
  TABPFN_V2_ARCH: v3.5
  TABPFN_V2_TASK: multitask
  TABPFN_V2_CONFIG_NAME: stage1
  TABPFN_V2_STOP_STEP: "50000"
  TABPFN_V2_BATCH_SIZE: "64"
  TABPFN_V2_MICRO_BATCH: "8"
  TABPFN_V2_KEEP_EVERY: "5000"
  TABPFN_V2_VAL_EVERY: "2500"
  TABPFN_V2_COLLAPSE_THRESHOLD: "off"
  TABPFN_V2_COMPILE: "1"
  TABPFN_V2_TF32: "1"
  TABPFN_V2_MUON_DISTRIBUTED: all
  TABPFN_V2_NUM_WORKERS: "16"
max_retries: 0
timeout_minutes: 540
# scripts/tabpfn_v3/train.yaml과 같은 명령 (PYTHONHASHSEED=1 고정)
command: >-
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  PYTHONHASHSEED=1
  PYTHONPATH=$CODE_SOURCE_PATH/src
  torchrun --standalone --nproc_per_node=8 $CODE_SOURCE_PATH/scripts/tabpfn_v2/train.py
