# TabPFN-3.5 checkpoint의 attention 진단 (issue #102, scripts/tabpfn_v3/attention_probe.py): 층마다 soft-cap
# 전 logit |max|·entropy, 온도 배율(QASSMax·LogScale), QK-norm gain, LogScale a_h, 검증 손실.
#   databricks air run -f scripts/tabpfn_v3/attention_probe.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override "env_variables.PROBE_CKPTS=runs:/<run_id>/checkpoints/step_0005000.pt runs:/<run_id>/checkpoints/step_0010000.pt" \
#     --override "env_variables.PROBE_LABELS=<run_id>=A"
experiment_name: tabpfn-v3-reproduction
mlflow_run_name: tabpfn-v3-5-attention-probe
environment:
  version: databricks_ai_v6
  # 검증 batch를 만드는 TabICL prior
  dependencies:
    - tabicl>=2.2
compute:
  accelerator_type: GPU_1xH100
  num_accelerators: 1
code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - scripts/tabpfn_v3/attention_probe.py
env_variables:
  PROBE_CKPTS: ""
  PROBE_LABELS: ""
max_retries: 0
timeout_minutes: 120
# 검증 batch가 학습 run과 같도록 PYTHONHASHSEED=1 (학습 명령과 같다)
command: >-
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  PYTHONHASHSEED=1
  PYTHONPATH=$CODE_SOURCE_PATH/src
  python $CODE_SOURCE_PATH/scripts/tabpfn_v3/attention_probe.py --out /tmp/attention_probe.json
