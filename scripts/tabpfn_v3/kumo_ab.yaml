# Kumo-Tabular 부품 비교 학습 (issue #110): #102의 기준 arm B(Kumo식 attention 온도, soft-cap 없음, lr
# 8e-4) 위에 부품 하나씩(`TABPFN_V2_KUMO_OPTIONS`, recipes/kumo_tabular.py의 OPTIONS)을 얹는다. 나머지는
# scripts/tabpfn_v3/attention_temperature.yaml의 B와 같다: curriculum stage 1을 처음부터 8×H100, batch
# 64로 돌리고 50k step에서 멈춘다(lr 스케줄은 stage 1 그대로, warmup 2,500·250k cosine). v3.5
# multitask, 모든 파라미터 Muon, 1,024행, compile·TF32·분산 Muon·worker 16, 붕괴 되돌리기 끔,
# checkpoint 5k마다(scripts/tabpfn_v3/attention_probe.yaml로 잰다). seed도 B와 같다.
#   databricks air run -f scripts/tabpfn_v3/kumo_ab.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override mlflow_run_name=tabpfn-v3-5-kumo110-D-50k \
#     --override env_variables.TABPFN_V2_KUMO_OPTIONS=decoder_qk_norm
#   D: decoder_qk_norm    W: stages (열·행 단계가 넓어 step이 느리다: timeout_minutes를 늘린다)
#   Q: quantile_head      C: categorical_encoder
experiment_name: tabpfn-v3-reproduction
mlflow_run_name: tabpfn-v3-5-kumo110-50k
environment:
  version: databricks_ai_v6
  # TabICL prior (uv.lock과 같은 버전. 범주 열 표시(arm C)는 이 버전의 GraphSCM을 옮긴 것이다)
  dependencies:
    - tabicl==2.2.0
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8
code_source:
  type: snapshot
  snapshot:
    root_path: ../..
    include_paths:
      - src
      - scripts/tabpfn_v2/train.py
env_variables:
  TABPFN_V2_ARCH: v3.5
  TABPFN_V2_TASK: multitask
  TABPFN_V2_CONFIG_NAME: stage1
  TABPFN_V2_ATTENTION_TEMPERATURE: kumo
  TABPFN_V2_LOGIT_SOFTCAP: none
  TABPFN_V2_LR: "8e-4"
  TABPFN_V2_KUMO_OPTIONS: ""
  TABPFN_V2_STOP_STEP: "50000"
  TABPFN_V2_BATCH_SIZE: "64"
  TABPFN_V2_MICRO_BATCH: "8"
  TABPFN_V2_KEEP_EVERY: "5000"
  TABPFN_V2_VAL_EVERY: "2500"
  TABPFN_V2_COLLAPSE_THRESHOLD: "off"
  TABPFN_V2_COMPILE: "1"
  TABPFN_V2_TF32: "1"
  TABPFN_V2_MUON_DISTRIBUTED: all
  TABPFN_V2_NUM_WORKERS: "16"
max_retries: 0
timeout_minutes: 540
# scripts/tabpfn_v3/train.yaml과 같은 명령 (PYTHONHASHSEED=1 고정)
command: >-
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  PYTHONHASHSEED=1
  PYTHONPATH=$CODE_SOURCE_PATH/src
  torchrun --standalone --nproc_per_node=8 $CODE_SOURCE_PATH/scripts/tabpfn_v2/train.py
