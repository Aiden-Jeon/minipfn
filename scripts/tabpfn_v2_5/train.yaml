# TabPFN-2.5 prior-fitting (arXiv 2511.08667 재현, TabICL prior). 학습 코드는 v2와 같고
# (scripts/tabpfn_v2/train.py), TABPFN_V2_ARCH=v2.5가 2.5 구조(층 회귀 18·분류 24, 셀 3개 묶기,
# thinking 행 64개, 회귀 MLP encoder)를 고른다:
#   databricks air run -f scripts/tabpfn_v2_5/train.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR
# 기본은 8×H100에서 2.5 분류 모델·batch 64로 300 step 실측. 규모는 override로 바꾼다:
#   회귀:        --override env_variables.TABPFN_V2_TASK=regression
#   논문 규모:   --override env_variables.TABPFN_V2_CONFIG_NAME=paper --override env_variables.TABPFN_V2_STEPS=<전체 step> \
#                --override env_variables.TABPFN_V2_STOP_STEP=<이번 chunk 끝> \
#                --override mlflow_run_name=tabpfn-v2-5-<task>-paper-chunkNN --override timeout_minutes=<추정 시간>
#   이어서 학습: --override env_variables.TABPFN_V2_RESUME_RUN_ID=<run_id>
#   긴 표:       --override env_variables.TABPFN_V2_CONFIG_NAME=long_tables \
#                --override env_variables.TABPFN_V2_INIT_RUN_ID=<paper run_id> (TABPFN_V2_INIT_STEP=<step>)
#                (가중치만 가져와 새 optimizer로 행 512~8,192개·feature 최대 500개 표를 학습한다)
#   노드 여러 대: --override compute.num_accelerators=16 (또는 32) --override mlflow_run_name=<이름>-16gpu
# 그 밖의 환경변수(QK-clip, lr, 붕괴 감지 등)는 scripts/tabpfn_v2/train.yaml과 같다.
experiment_name: tabpfn-v2-5-reproduction
mlflow_run_name: tabpfn-v2-5-timing-300steps-8gpu
environment:
  # AI v6: Python 3.12, torch 2.11.0+cu130 (pyproject.toml의 torch 고정 범위와 같다)
  version: databricks_ai_v6
  # 기본 환경에 없는 패키지 (학습 데이터를 만드는 TabICL prior)
  dependencies:
    - tabicl>=2.2
compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8
code_source:
  type: snapshot
  snapshot:
    # 저장소 루트를 기준으로 src/와 학습 스크립트만 올린다 (노트북은 올리지 않는다)
    root_path: ../..
    include_paths:
      - src
      - scripts/tabpfn_v2/train.py
env_variables:
  TABPFN_V2_ARCH: v2.5
  TABPFN_V2_TASK: classification
  TABPFN_V2_CONFIG_NAME: paper
  TABPFN_V2_STEPS: "300"
  # GPU당 prior 생성 worker 수. 노드의 CPU 수에 맞춰 조정한다.
  TABPFN_V2_NUM_WORKERS: "8"
max_retries: 0
timeout_minutes: 60
# scripts/tabpfn_v2/train.yaml과 같은 명령 (노드 묶기, expandable_segments, PYTHONHASHSEED=1 고정)
command: >-
  PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  PYTHONHASHSEED=1
  PYTHONPATH=$CODE_SOURCE_PATH/src
  torchrun $(if [ "${NUM_NODES:-1}" -gt 1 ]; then
  echo --nnodes=$NUM_NODES --node_rank=$NODE_RANK --master_addr=$MASTER_ADDR --master_port=$MASTER_PORT;
  else echo --standalone; fi)
  --nproc_per_node=8 $CODE_SOURCE_PATH/scripts/tabpfn_v2/train.py
