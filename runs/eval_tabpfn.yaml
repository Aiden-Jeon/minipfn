# TabPFN 평가 (논문 Table 1: OpenML-CC18 18개 × 5 split, sklearn 기본값 baseline과 비교).
# 모델은 TABPFN_EXTRA_ARGS로 넘긴다. 학습 run이 남긴 모델·checkpoint는 runs:/ URI로 준다:
#   databricks air run -f runs/eval_tabpfn.yaml --watch --override mlflow_experiment_directory=$MLFLOW_EXPERIMENT_DIR \
#     --override "env_variables.TABPFN_EXTRA_ARGS=--model-path runs:/<run_id>/model/tabpfn_final.pt"
#   학습 중 checkpoint:  --model-path runs:/<run_id>/checkpoints/step_0003000.pt
#   Hub 모델:           --hub-repo aiden-jeon/minipfn-tabpfn-v1
experiment_name: tabpfn-reproduction
mlflow_run_name: tabpfn-eval
environment:
  # AI v6: Python 3.12, torch 2.11.0+cu130 (pyproject.toml의 torch 고정 범위와 같다)
  version: databricks_ai_v6
  # 기본 환경에 없는 패키지 (OpenML 데이터, Hugging Face 가중치)
  dependencies:
    - openml>=0.15
    - huggingface-hub>=0.34
compute:
  accelerator_type: GPU_1xH100
  num_accelerators: 1
code_source:
  type: snapshot
  snapshot:
    # 저장소 루트를 기준으로 src/와 이 스크립트만 올린다 (노트북은 올리지 않는다)
    root_path: ..
    include_paths:
      - src
      - scripts/tabpfn/eval.py
env_variables:
  TABPFN_EXTRA_ARGS: ""
max_retries: 0
timeout_minutes: 120
command: >-
  PYTHONPATH=$CODE_SOURCE_PATH/src
  python $CODE_SOURCE_PATH/scripts/tabpfn/eval.py $TABPFN_EXTRA_ARGS
